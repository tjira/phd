!config
identifier: setup
name: Project Setup
commands:
- name: Creating build folders
  command: >
    @{
      import java.io.File;

      for (root : ["parts"]) {

        base = new File("build", root); base.mkdirs();

        for (file : new File(root).listFiles()) {
          if (file.directory) new File(base, file.name).mkdirs();
        }
      }

      return true;
    }
